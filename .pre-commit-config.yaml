repos:
  # Python — ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # JavaScript — ESLint (auto-fix)
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: pnpm exec eslint --fix
        language: node
        types: [ts]
        pass_filenames: true

      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write
        language: node
        types_or: [ts, json, css, html]
        pass_filenames: true

      # Python tests run on push only (too slow for every commit)
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
