<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyra TTS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
        <img alt="" class="logo" src="../icons/icon-48.png"/>
      <div class="header-text">
        <h1>Lyra</h1>
        <span id="status-badge" class="badge badge--checking">Checking…</span>
      </div>
    </header>

    <section class="controls">
        <div class="filter-row">
            <div class="filter">
                <label class="label" for="language-filter">Language</label>
                <select class="select" id="language-filter">
                    <option value="">All</option>
                </select>
            </div>
            <div class="filter">
                <label class="label" for="gender-filter">Gender</label>
                <select class="select" id="gender-filter">
                    <option value="">All</option>
                </select>
            </div>
        </div>
        <div class="filter">
            <label class="label" for="voice-select">Voice</label>
            <select class="select" id="voice-select">
                <option value="">Loading…</option>
            </select>
        </div>
        <div class="filter">
            <label class="label label--row" for="speed">
                Speed <output id="speed-value" for="speed">1×</output>
            </label>
            <input class="range" id="speed" type="range" min="0.5" max="2" step="0.05" value="1" />
        </div>
    </section>

    <section class="actions">
        <button class="btn btn--primary" disabled id="btn-read-selection">Read selection</button>
        <button class="btn btn--secondary" disabled id="btn-read-page">Read page</button>
        <div class="playback" id="playback" style="display: none">
            <button class="btn btn--secondary btn--icon" id="btn-back" aria-label="Back one passage" title="Back one passage">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
            </button>
            <button class="btn btn--secondary" id="btn-pause">Pause</button>
            <button class="btn btn--secondary btn--icon" id="btn-forward" aria-label="Forward one passage" title="Forward one passage">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
            </button>
        </div>
        <button class="btn btn--danger" id="btn-stop" style="display: none">Stop reading</button>
    </section>

    <footer class="footer">
      <a id="options-link" href="#" class="link">Settings</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
