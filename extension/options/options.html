<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyra TTS — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <img src="../icons/icon-48.png" alt="" class="logo" />
        <h1>Lyra TTS Settings</h1>
      </header>

      <section class="card">
        <h2>Server</h2>

        <div class="field">
          <label for="server-url" class="field__label">
            Server URL
            <span class="field__hint">The address of your running Lyra web server.</span>
          </label>
          <input
            id="server-url"
            type="url"
            class="field__input"
            placeholder="http://127.0.0.1:8000"
          />
        </div>

        <div id="server-status" class="server-status server-status--idle">
          Enter a URL and click Check to verify connectivity.
        </div>

        <button id="btn-check" class="btn btn--secondary btn--sm">Check connection</button>
      </section>

      <section class="card">
        <h2>Defaults</h2>

        <div class="field">
          <label for="model-select" class="field__label">
            Model
            <span class="field__hint">
              TTS model to use. Changing the model updates the voice list.
            </span>
          </label>
          <select id="model-select" class="field__input">
            <option value="mlx-community/Kokoro-82M-bf16">Kokoro 82M (default)</option>
          </select>
        </div>

        <div class="field">
          <label for="default-voice" class="field__label">
            Default voice
            <span class="field__hint">
              Used when no voice is selected in the popup.
            </span>
          </label>
          <select id="default-voice" class="field__input">
            <option value="af_heart">Heart (American ♀)</option>
          </select>
        </div>
      </section>

      <div class="actions">
        <button id="btn-save" class="btn btn--primary">Save settings</button>
        <button id="btn-reset" class="btn btn--ghost">Reset to defaults</button>
      </div>

      <p id="save-msg" class="save-msg" aria-live="polite"></p>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
