<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyra TTS — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <img src="../icons/icon-48.png" alt="" class="logo" />
          <h1>Lyra Settings</h1>
      </header>

      <section class="card">
        <h2>Server</h2>

        <div class="field">
          <label for="server-url" class="field__label">
            Server URL
              <span class="field__hint">The address of your running Lyra TTS server.</span>
          </label>
          <input
            id="server-url"
            type="url"
            class="field__input"
            placeholder="http://127.0.0.1:8000"
          />
        </div>

        <div id="server-status" class="server-status server-status--idle">
            Enter a URL and click Check connection to verify.
        </div>

        <button id="btn-check" class="btn btn--secondary btn--sm">Check connection</button>
      </section>

      <section class="card">
          <h2>Voice &amp; model</h2>

        <div class="field">
          <label for="model-select" class="field__label">
            Model
              <span class="field__hint">Changing the model refreshes the voice list.</span>
          </label>
          <select id="model-select" class="field__input">
              <option value="mlx-community/Kokoro-82M-bf16">Kokoro 82M</option>
          </select>
        </div>

          <div class="field-row">
              <div class="field">
                  <label class="field__label" for="language-filter">
                      Language
                      <span class="field__hint">Narrow the voices.</span>
                  </label>
                  <select class="field__input" id="language-filter">
                      <option value="">All</option>
                  </select>
              </div>
              <div class="field">
                  <label class="field__label" for="gender-filter">
                      Gender
                      <span class="field__hint">Narrow the voices.</span>
                  </label>
                  <select class="field__input" id="gender-filter">
                      <option value="">All</option>
                  </select>
              </div>
          </div>

          <div class="field">
          <label for="default-voice" class="field__label">
            Default voice
              <span class="field__hint">Used when no voice is picked in the popup.</span>
          </label>
          <select id="default-voice" class="field__input">
              <option value="af_heart">Heart</option>
          </select>
        </div>

          <button class="btn btn--secondary btn--sm" id="btn-test-sound">Play a test sound</button>
          <div class="test-status" id="test-status" style="display: none"></div>
      </section>

      <section class="card">
        <h2>Reading</h2>

        <div class="field">
          <label for="speed" class="field__label">
            <span class="field__label-row">Speed <output id="speed-value" for="speed">1×</output></span>
            <span class="field__hint">Changes take effect from the next passage.</span>
          </label>
          <input id="speed" type="range" class="range" min="0.5" max="2" step="0.05" value="1" />
        </div>

        <div class="field">
          <label for="focus-mode" class="field__label">
            Focus mode
            <span class="field__hint">Helps keep your place. Also switchable from the button on the reading bar.</span>
          </label>
          <select id="focus-mode" class="field__input">
            <option value="off">Off</option>
            <option value="ruler">Ruler: dim all but the line being read</option>
            <option value="spotlight">Spotlight: dim all but the paragraph being read</option>
          </select>
        </div>

        <label class="checkbox">
          <input id="click-to-read" type="checkbox" checked />
          Alt+click (Option+click on macOS) a paragraph to read from there
        </label>
      </section>

      <section class="card">
        <h2>Highlight</h2>

        <label class="checkbox">
          <input id="word-highlight" type="checkbox" checked />
          Follow along word by word (highlights the sentence and the spoken word)
        </label>

        <fieldset class="field">
          <legend class="field__label">
            Sentence colour
            <span class="field__hint">The sentence (or passage) being read.</span>
          </legend>
          <div class="swatches" id="highlight-swatches">
            <label class="swatch swatch--custom" title="Custom colour">
              <input id="highlight-color" type="color" value="#dcd7fc" aria-label="Custom passage colour" />
            </label>
          </div>
        </fieldset>

        <div class="field-row">
          <div class="field">
            <label for="word-color" class="field__label">
              Word colour
              <span class="field__hint">The word being spoken.</span>
            </label>
            <input id="word-color" type="color" class="field__input field__input--color" value="#ffd84d" />
          </div>
          <div class="field">
            <label for="highlight-style" class="field__label">
              Style
              <span class="field__hint">How the sentence is marked.</span>
            </label>
            <select id="highlight-style" class="field__input">
              <option value="background">Background</option>
              <option value="underline">Underline</option>
              <option value="both">Background and underline</option>
            </select>
          </div>
        </div>

        <label class="checkbox">
          <input id="high-contrast" type="checkbox" />
          High contrast (light text on a dark highlight)
        </label>

        <p class="preview" id="highlight-preview" aria-label="Highlight preview">
          Orpheus went down to the underworld.
          <span class="preview__chunk">He sang so sweetly that <span class="preview__word">Hades</span> wept,</span>
          and let Eurydice follow him home.
        </p>
      </section>

      <section class="card">
        <h2>Keyboard shortcuts</h2>
        <dl class="shortcuts" id="shortcuts"></dl>
        <button id="btn-shortcuts" class="btn btn--secondary btn--sm">Change shortcuts</button>
      </section>

      <div class="actions">
        <button id="btn-save" class="btn btn--primary">Save settings</button>
        <button id="btn-reset" class="btn btn--ghost">Reset to defaults</button>
      </div>

      <p id="save-msg" class="save-msg" aria-live="polite"></p>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
