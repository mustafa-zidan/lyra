[project]
name = "lyra"
version = "0.1.0"
description = "TTS web server and browser extension powered by mlx-audio (Kokoro)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.1",
    "numpy>=2.5.4",
]

# TTS runtime extras — pick exactly one for your platform. Without one the server starts
# but reports TTS unavailable (/health "degraded", /tts/generate 503), which is what CI uses.
# Each extra is gated by a platform marker, so selecting the wrong one installs nothing.
[project.optional-dependencies]
# macOS on Apple Silicon: mlx pulls in mlx-metal (GPU via Metal).
apple = [
    "torch; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en,ja,zh]; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "unidic-lite; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Linux, CPU only (x86_64 / aarch64): mlx[cpu] pulls in mlx-cpu.
linux-cpu = [
    "mlx[cpu]; sys_platform == 'linux'",
    "mlx-audio; sys_platform == 'linux'",
    "torch; sys_platform == 'linux'",
    "misaki[en,ja,zh]; sys_platform == 'linux'",
    "unidic-lite; sys_platform == 'linux'",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'linux'",
]
# Linux with an NVIDIA GPU (CUDA 12): mlx[cuda12] pulls in mlx-cuda-12.
linux-cuda = [
    "mlx[cuda12]; sys_platform == 'linux'",
    "mlx-audio; sys_platform == 'linux'",
    "torch; sys_platform == 'linux'",
    "misaki[en,ja,zh]; sys_platform == 'linux'",
    "unidic-lite; sys_platform == 'linux'",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'linux'",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.17.2",
    "pre-commit>=4.7.0",
]

[project.scripts]
lyra = "server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv]
# mlx-cpu and mlx-cuda-12 both provide mlx's native backend; never install both.
conflicts = [
    [{ extra = "linux-cpu" }, { extra = "linux-cuda" }],
]
# preshed 3.0.14 breaks spaCy 3.8.16 loading en_core_web_sm ("OverflowError: Python int too
# large to convert to C ssize_t" in Tokenizer._flush_specials), which kills English G2P.
constraint-dependencies = ["preshed<3.0.14"]

# torch comes in via misaki[en] (spacy-curated-transformers) and is used only to convert the
# German Kokoro .pth checkpoints to MLX, never for inference. On Linux PyPI ships the multi-GB CUDA build, so use CPU wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
