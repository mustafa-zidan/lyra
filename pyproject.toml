[project]
name = "lyra"
version = "0.1.0"
description = "TTS web server and browser extension powered by eurydice-tts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

dependencies = [
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
    "pydantic-settings>=2.14.2",
    "eurydice-tts[audio]",
]

[tool.uv.sources]
eurydice-tts = { path = "../eurydice", editable = true }

[project.optional-dependencies]
mlx = [
    "mlx-audio",
    "misaki[en]",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.15.20",
    "pre-commit>=4.6.0",
]

[project.scripts]
lyra = "server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
